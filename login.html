<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na plataforma M.E.N.T.E">
    <title>Entrar | M.E.N.T.E</title>
    <link rel="stylesheet" href="style.css?v=8">
  </head>
  <body class="login-page">
    <header class="site-header login-header">
      <a class="brand" href="./index.html" aria-label="Voltar para a página inicial">
        <img class="brand__logo" src="./assets/logo-mente-original.png" alt="M.E.N.T.E">
      </a>
      <a class="login-header__back" href="./index.html">← Voltar para o início</a>
    </header>

    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <p class="section-label">Área do aluno</p>
        <h1 id="login-title">Entre no M.E.N.T.E</h1>
        <p class="login-card__description">Continue seus estudos de Matemática para o ENEM.</p>

        <form class="login-form" action="#" method="post">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>

          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>

          <button type="submit">Entrar</button>
        </form>

        <a class="login-card__home" href="./index.html#sobre">Conheça melhor o projeto</a>
      </section>
    </main>
  </body>
</html>
